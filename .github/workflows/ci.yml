name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=witnesscell --cov-branch --cov-report=term-missing
      - run: python scripts/audit_anonymity.py .

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "numpy==2.2.0"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy --disable-error-code=type-arg --disable-error-code=var-annotated --disable-error-code=arg-type --disable-error-code=unused-ignore src/witnesscell
      - run: python -m pip_audit --strict .

  package:
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - name: Build twice and verify reproducibility
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m build --outdir dist-a
          python scripts/normalize_sdist.py dist-a/*.tar.gz
          python -m build --outdir dist-b
          python scripts/normalize_sdist.py dist-b/*.tar.gz
          cmp dist-a/*.whl dist-b/*.whl
          cmp dist-a/*.tar.gz dist-b/*.tar.gz
          mv dist-a dist
      - run: twine check --strict dist/*
      - run: python scripts/verify_distribution.py --wheel dist/*.whl --sdist dist/*.tar.gz
      - run: python scripts/audit_anonymity.py dist
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/witnesscell-wheel
          /tmp/witnesscell-wheel/bin/python -m pip install dist/*.whl
          /tmp/witnesscell-wheel/bin/python -m pip check
          /tmp/witnesscell-wheel/bin/witnesscell --version
      - name: Smoke-test built sdist
        run: |
          python -m venv /tmp/witnesscell-sdist
          /tmp/witnesscell-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/witnesscell-sdist/bin/python -m pip check
          /tmp/witnesscell-sdist/bin/witnesscell --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
