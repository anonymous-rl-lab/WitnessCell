name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=witnesscell --cov-branch --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/verify_release_tag.py --tag "${GITHUB_REF_NAME}"
      - run: ruff check src tests scripts
      - run: mypy src/witnesscell
      - run: python -m pip_audit --strict .
      - run: python scripts/audit_anonymity.py .
      - name: Build twice and verify reproducibility
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m build --outdir dist-a
          python scripts/normalize_sdist.py dist-a/*.tar.gz
          python -m build --outdir dist-b
          python scripts/normalize_sdist.py dist-b/*.tar.gz
          cmp dist-a/*.whl dist-b/*.whl
          cmp dist-a/*.tar.gz dist-b/*.tar.gz
          mv dist-a dist
      - run: twine check --strict dist/*
      - run: python scripts/verify_distribution.py --wheel dist/*.whl --sdist dist/*.tar.gz
      - run: python scripts/audit_anonymity.py dist
      - name: Smoke-test release wheel
        run: |
          python -m venv /tmp/witnesscell-release
          /tmp/witnesscell-release/bin/python -m pip install dist/*.whl
          /tmp/witnesscell-release/bin/python -m pip check
          /tmp/witnesscell-release/bin/witnesscell --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/witnesscell
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
