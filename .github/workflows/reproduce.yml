name: Paper reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -r requirements.txt
      - run: python -B tools/check_environment.py
      - run: python -B tools/verify.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B reproduce.py --out ../smoke-results --tasks paper_scores theory_growth interfaces coverage --jobs 2
  full-replay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -r requirements.txt
      - run: python -B reproduce.py --out ../full-results --jobs 2 --compatible
      - run: python -B tools/verify.py --restored --compatible
