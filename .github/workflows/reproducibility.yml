name: Reproducibility smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-repro-v14.txt
      - run: python -m pip install -e . --no-deps
      - run: bash scripts/run_smoke.sh
      - run: DATASETS=Norman SEEDS=1 OUTPUT_DIR=/tmp/witnesscell-v14 python -c "import witnesscell; print(witnesscell.__version__)"
      - run: DATASETS=Norman SEEDS=1 OUTPUT_DIR=/tmp/witnesscell-v14 bash scripts/reproduce_v14.sh
