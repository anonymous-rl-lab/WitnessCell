[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "witnesscell"
version = "0.1.0"
description = "Evidence-gated condition-mean prediction for unmeasured genetic combinations"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["single-cell", "genetic-perturbation", "gene-regulation", "selective-prediction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10,<1"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "twine>=5,<7",
]

[project.scripts]
witnesscell = "witnesscell.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
witnesscell = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["witnesscell"]
strict = true
warn_unreachable = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["witnesscell"]

[tool.coverage.report]
show_missing = true
fail_under = 80
